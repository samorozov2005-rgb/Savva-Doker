spring.application.name=taskapi
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:my_strong_password_here}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:localDevelopmentSecretKeyAtLeast32CharactersLong}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
